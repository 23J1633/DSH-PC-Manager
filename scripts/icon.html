<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        width: 512px;
        height: 512px;
        margin: 0;
        overflow: hidden;
        background: #fff;
      }

      .tile {
        position: absolute;
        inset: 24px;
        display: grid;
        place-items: center;
        background: #fff;
        border-radius: 116px;
      }

      img {
        width: 380px;
        height: 380px;
        color: #06080c;
      }
    </style>
  </head>
  <body>
    <div class="tile"><img src="../public/whale.svg" alt="" /></div>
  </body>
</html>
